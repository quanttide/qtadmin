name: Deploy to OSS

on:
  push:
    tags:
      - 'studio/*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - run: cd src/studio && flutter pub get
      - run: cd src/studio && flutter build web

      - uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: oss-cn-hangzhou.aliyuncs.com
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - run: ossutil cp src/studio/build/web/ oss://qtadmin-studio/ -r -f --meta=Cache-Control:public,max-age=31536000

      # 元信息与入口文件单独 no-cache：内容随版本变更，长缓存会导致浏览器拿不到新版
      - run: ossutil cp src/studio/build/web/manifest.json oss://qtadmin-studio/manifest.json -f --meta=Cache-Control:no-cache
      - run: ossutil cp src/studio/build/web/index.html oss://qtadmin-studio/index.html -f --meta=Cache-Control:no-cache
      - run: ossutil cp src/studio/build/web/flutter_bootstrap.js oss://qtadmin-studio/flutter_bootstrap.js -f --meta=Cache-Control:no-cache

      - name: Refresh CDN
        run: |
          pip install aliyun-python-sdk-cdn
          python -c "
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcdn.request.v20180510.RefreshObjectCachesRequest import RefreshObjectCachesRequest
          import os
          cli = AcsClient(os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'], 'cn-hangzhou')
          for domain in ['admin.quanttide.com']:
              req = RefreshObjectCachesRequest()
              req.set_ObjectPath(f'https://{domain}/')
              req.set_ObjectType('Directory')
              cli.do_action_with_exception(req)
          "
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
